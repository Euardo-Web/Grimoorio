services:
  - type: web
    runtime: static
    name: grimoorio-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /fichas-de-rpg
        destination: /fichas-de-rpg/index.html
      - type: rewrite
        source: /campanhas-de-rpg
        destination: /campanhas-de-rpg/index.html
      - type: rewrite
        source: /*
        destination: /app-shell.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: REACT_APP_BACKEND_URL
        value: https://grimoorio-backend.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
